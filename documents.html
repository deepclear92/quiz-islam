<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Documents - Tariqa Qadiriyya Boutchichiyya</title>
    <meta name="theme-color" content="#1a7a4c">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f0e8;
            color: #2c2c2c;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a7a4c 0%, #0d5c38 100%);
            color: white;
            padding: 24px 20px 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }

        .header .logo {
            font-size: 2.2rem;
            margin-bottom: 6px;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header .subtitle {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 4px;
        }

        .back-btn {
            position: absolute;
            top: 18px;
            left: 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .back-btn:hover { background: rgba(255,255,255,0.3); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .intro {
            text-align: center;
            margin-bottom: 28px;
            color: #555;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .doc-card {
            background: white;
            border-radius: 16px;
            padding: 24px 20px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #e8e0d0;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .doc-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .doc-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .doc-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1a7a4c;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .doc-subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 16px;
        }

        .qr-container {
            background: #fff;
            border: 2px solid #e8e0d0;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 16px;
        }

        .qr-container canvas, .qr-container img {
            display: block;
            border-radius: 6px;
        }

        .doc-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-download {
            background: #1a7a4c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-download:hover { background: #0d5c38; }

        .btn-print {
            background: #f5f0e8;
            color: #555;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .btn-print:hover { background: #ede7d7; }

        .pages-badge {
            display: inline-block;
            background: #f0f7f4;
            color: #1a7a4c;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 14px;
            border: 1px solid #c3e0d4;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #aaa;
            font-size: 0.8rem;
        }

        @media print {
            .back-btn, .btn-print, .intro { display: none; }
            .docs-grid { grid-template-columns: repeat(2, 1fr); }
            .doc-card { break-inside: avoid; }
        }

        @media (max-width: 480px) {
            .docs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header" style="position:relative;">
    <a href="index.html" class="back-btn">&#8592; Retour</a>
    <div class="logo">&#128218;</div>
    <h1>Documents à télécharger</h1>
    <p class="subtitle">Tariqa Qadiriyya Boutchichiyya</p>
</div>

<div class="container">
    <p class="intro">
        Scannez le QR code avec votre téléphone pour télécharger chaque document directement,
        ou cliquez sur le bouton de téléchargement.
    </p>

    <div class="docs-grid" id="docs-grid"></div>
</div>

<div class="footer">
    Tariqa Qadiriyya Boutchichiyya &mdash; Quiz Islam
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const BASE_URL = "https://deepclear92.github.io/quiz-islam/documents/";

const documents = [
    {
        id: "testament",
        file: "testament-sidi-hamza.pdf",
        title: "Testament de Sidi Hamza",
        subtitle: "Sidi Hamza Kadiri Boutchich — 3 octobre 1990",
        icon: "📜",
        pages: "3 pages",
        lang: "Français"
    },
    {
        id: "lettre-munir",
        file: "lettre-sidi-munir.pdf",
        title: "Lettre à Sidi Munir",
        subtitle: "رسالة إلى سيدي منير — M. Toufiq",
        icon: "✉️",
        pages: "11 pages",
        lang: "Arabe"
    },
    {
        id: "risala-wazir",
        file: "risala-wazir-2.pdf",
        title: "رسالة الوزير ٢",
        subtitle: "Risala Al-Wazir 2",
        icon: "📄",
        pages: "2 pages",
        lang: "Arabe"
    },
    {
        id: "risala",
        file: "risala.pdf",
        title: "رسالة",
        subtitle: "Risala",
        icon: "📋",
        pages: "4 pages",
        lang: "Arabe"
    },
    {
        id: "document-scan",
        file: "document-scan.pdf",
        title: "Document scanné",
        subtitle: "Document numérisé",
        icon: "🔍",
        pages: "2 pages",
        lang: "Arabe"
    }
];

function printQR(id) {
    const card = document.getElementById("card-" + id);
    const w = window.open("", "_blank");
    const qrEl = card.querySelector(".qr-container");
    const title = card.querySelector(".doc-title").textContent;
    const canvas = qrEl.querySelector("canvas");
    const dataUrl = canvas ? canvas.toDataURL() : "";
    w.document.write(`<!DOCTYPE html><html><head><title>${title}</title>
    <style>body{font-family:sans-serif;text-align:center;padding:40px;}
    h2{margin-bottom:20px;color:#1a7a4c;}img{border:2px solid #ddd;border-radius:8px;padding:8px;}</style>
    </head><body><h2>${title}</h2><img src="${dataUrl}" width="220"><br><br>
    <p style="font-size:0.85rem;color:#888;">Scannez pour télécharger</p>
    <script>window.onload=()=>window.print()<\/script></body></html>`);
    w.document.close();
}

const grid = document.getElementById("docs-grid");

documents.forEach(doc => {
    const url = BASE_URL + doc.file;

    const card = document.createElement("div");
    card.className = "doc-card";
    card.id = "card-" + doc.id;
    card.innerHTML = `
        <div class="doc-icon">${doc.icon}</div>
        <div class="doc-title">${doc.title}</div>
        <div class="doc-subtitle">${doc.subtitle}</div>
        <span class="pages-badge">${doc.pages} &bull; ${doc.lang}</span>
        <div class="qr-container" id="qr-${doc.id}"></div>
        <div class="doc-actions">
            <a class="btn-download" href="${url}" download>&#11015; Télécharger</a>
            <button class="btn-print" onclick="printQR('${doc.id}')">🖨️ Imprimer QR</button>
        </div>
    `;
    grid.appendChild(card);

    new QRCode(document.getElementById("qr-" + doc.id), {
        text: url,
        width: 200,
        height: 200,
        colorDark: "#1a7a4c",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
    });
});
</script>
</body>
</html>
