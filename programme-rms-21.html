<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f0e8;
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a7a4c 0%, #0d5c38 100%);
            color: white;
            padding: 22px 20px 18px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 16px; left: 14px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 0.88rem;
            cursor: pointer;
            text-decoration: none;
        }
        .header .logo { font-size: 2rem; margin-bottom: 4px; }
        .header h1 { font-size: 1.2rem; font-weight: 700; }
        .header p { font-size: 0.82rem; opacity: 0.85; margin-top: 3px; }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 36px 32px 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #e8e0d0;
        }

        .card-icon { font-size: 2.4rem; margin-bottom: 10px; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: #1a7a4c; margin-bottom: 4px; }
        .card-subtitle { font-size: 0.82rem; color: #999; margin-bottom: 22px; }

        .qr-wrap {
            display: inline-block;
            border: 3px solid #1a7a4c;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 20px;
            background: white;
        }
        .qr-wrap img { display: block; border-radius: 8px; }

        .scan-hint {
            font-size: 0.83rem;
            color: #777;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1a7a4c;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            padding: 13px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            transition: background 0.2s;
            width: 100%;
            justify-content: center;
        }
        .btn-download:hover { background: #0d5c38; }
        .btn-secondary {
            margin-top: 10px;
            background: transparent;
            color: #1a7a4c;
            border: 1.5px solid #cfe3d7;
        }
        .btn-secondary:hover { background: #eef6f1; }

        .file-info {
            margin-top: 12px;
            font-size: 0.73rem;
            color: #bbb;
        }
    </style>
